# Stage upstream updates in a PR; auto-merge only after required checks pass.
name: Sync with Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
    steps:
      # A repository-scoped user token triggers normal push/PR checks without
      # the manual approval required for PRs created with GITHUB_TOKEN.
      - name: Require dedicated sync token
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure the UPSTREAM_SYNC_TOKEN Actions secret (repository-scoped fine-grained token). See scripts/i18n/README.md."
            exit 1
          fi

      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage upstream merge on candidate branch
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/optiscaler/OptiScaler.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B upstream-sync-candidate
          git merge --no-edit upstream/master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push staged candidate
        if: steps.stage.outputs.changed == 'true'
        shell: bash
        run: |
          git push --force-with-lease origin upstream-sync-candidate

      # The dedicated token triggers the existing push/pull_request workflows.
      # Every gh call must explicitly target this fork, not the official upstream.
      - name: Open or reuse PR and enable auto-merge
        if: steps.stage.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --head upstream-sync-candidate --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head upstream-sync-candidate --title "chore: sync upstream (requires CI)" --body "Automated upstream sync candidate. Auto-merge waits for the required Windows x64 Release/translation and formatting checks. Conflicts or failed checks require manual fixes. In-game DX11/DX12/Vulkan validation is still required before release.")"
          fi
          # Preserve upstream ancestry with a merge commit, not squash/rebase.
          # Requires repository auto-merge and protected master with required CI.
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$(git rev-parse HEAD)"
          printf 'Upstream sync PR: %s\nAuto-merge requested; required checks must pass first.\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
