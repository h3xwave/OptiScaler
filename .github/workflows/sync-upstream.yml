# Stage upstream updates for review; never merge directly into master.
name: Sync with Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage upstream merge on candidate branch
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/optiscaler/OptiScaler.git
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B upstream-sync-candidate
          git merge --no-edit upstream/master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push staged candidate
        if: steps.stage.outputs.changed == 'true'
        shell: bash
        run: |
          git push --force-with-lease origin upstream-sync-candidate

      # workflow_dispatch is permitted to start another workflow with GITHUB_TOKEN.
      # A bot-generated push / PR alone may not trigger normal downstream checks.
      - name: Request candidate required checks
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run just_build_no_signature.yml --ref upstream-sync-candidate
          gh workflow run clang-format.yml --ref upstream-sync-candidate

      - name: Open or reuse PR
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh pr list --base master --head upstream-sync-candidate --state open --json number --jq 'length')" -eq 0 ]; then
            gh pr create --base master --head upstream-sync-candidate --title "chore: sync upstream (requires CI)" --body "Automated upstream sync candidate. Validate Windows x64 Release, translations, and in-game hooks before merging."
          fi
